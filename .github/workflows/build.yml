name: Build Web & Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Web bağımlılıklarını kur ve derle
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle izinlerini ver ve APK derle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Debug APK dosyasını Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: eymen-tv-radyo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
