name: EYMEN TV RADYO - Tek Güncel Android Sürümü

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Web bağımlılıkları ve build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Web dosyalarını Android içine koy
        run: |
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -R dist/. app/src/main/assets/www/

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Kalıcı release imzasını hazırla
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eymen-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/eymen-release.jks" >> "$GITHUB_ENV"

      - name: Release APK oluştur
        run: gradle --no-daemon :app:assembleRelease

      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EYMEN-TV-RADYO-7.0.0
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk

      - name: Tek güncel Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EYMEN TV & RADYO - Güncel Sürüm
          target_commitish: main
          make_latest: true
          prerelease: false
          generate_release_notes: false
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
