name: Build BELEŞ TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - "BELES-TV-APK/**"
      - ".github/workflows/beles-tv-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BELES-TV-APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beles-TV-debug
          path: BELES-TV-APK/app/build/outputs/apk/debug/app-debug.apk
