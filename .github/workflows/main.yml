name: Eymen TV & Radyo APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android TV & Telefon Projesi Olustur
        run: |
          mkdir -p android-apk/app/src/main/java/com/eymen/tvradyo
          mkdir -p android-apk/app/src/main/res/values
          mkdir -p android-apk/app/src/main/assets

          if [ -f "public/playlist.m3u8" ]; then
            cp public/playlist.m3u8 android-apk/app/src/main/assets/playlist.m3u8
          fi

          cat << 'EOF' > android-apk/settings.gradle.kts
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "EymenTVRadyo"
          include(":app")
          EOF

          cat << 'EOF' > android-apk/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > android-apk/build.gradle.kts
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > android-apk/app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.eymen.tvradyo"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.eymen.tvradyo"
              minSdk = 24
              targetSdk = 34
              versionCode = 3
              versionName = "2.1.0"
            }
            buildTypes {
              release {
                isMinifyEnabled = false
              }
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
              jvmTarget = "17"
            }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat << 'EOF' > android-apk/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">Eymen TV &amp; Radyo</string>
          </resources>
          EOF

          cat << 'EOF' > android-apk/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-feature android:name="android.software.leanback" android:required="false" />
            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
            <application
              android:allowBackup="true"
              android:label="@string/app_name"
              android:usesCleartextTraffic="true"
              android:hardwareAccelerated="true"
              android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > android-apk/app/src/main/java/com/eymen/tvradyo/MainActivity.kt
          package com.eymen.tvradyo

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.EditText
          import android.widget.FrameLayout
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView
            private lateinit var rootLayout: FrameLayout
            private var customView: View? = null
            private var customViewCallback: WebChromeClient.CustomViewCallback? = null

            companion object {
              private const val PREFS = "eymen_tv_prefs"
              private const val KEY_URL = "server_url"
              private const val DEFAULT_URL = "https://ais-pre-kng66soj44julsshe3k5yi-13286586836.europe-west2.run.app"
            }

            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

              rootLayout = FrameLayout(this).apply {
                setBackgroundColor(Color.parseColor("#0c1422"))
              }
              webView = WebView(this).apply {
                setBackgroundColor(Color.parseColor("#0c1422"))
                isFocusable = true
                isFocusableInTouchMode = true
                requestFocus()
              }

              val settings = webView.settings
              settings.javaScriptEnabled = true
              settings.domStorageEnabled = true
              settings.databaseEnabled = true
              settings.mediaPlaybackRequiresUserGesture = false
              settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
              settings.useWideViewPort = true
              settings.loadWithOverviewMode = true
              settings.userAgentString = settings.userAgentString.replace("; wv", "")

              webView.webChromeClient = object : WebChromeClient() {
                override fun onShowCustomView(view: View?, callback: CustomViewCallback?) {
                  if (customView != null) {
                    callback?.onCustomViewHidden()
                    return
                  }
                  customView = view
                  customViewCallback = callback
                  webView.visibility = View.GONE
                  rootLayout.addView(view, FrameLayout.LayoutParams(
                    ViewGroup.LayoutParams.MATCH_PARENT,
                    ViewGroup.LayoutParams.MATCH_PARENT
                  ))
                }

                override fun onHideCustomView() {
                  customView?.let { rootLayout.removeView(it) }
                  customView = null
                  customViewCallback?.onCustomViewHidden()
                  customViewCallback = null
                  webView.visibility = View.VISIBLE
                }
              }

              webView.webViewClient = object : WebViewClient() {
                override fun onReceivedError(
                  view: WebView?,
                  request: WebResourceRequest?,
                  error: WebResourceError?
                ) {
                  if (request?.isForMainFrame == true) {
                    showUrlDialog("Sunucuya baglanilamadi. Yayin adresini kontrol edin:")
                  }
                }

                override fun onReceivedHttpError(
                  view: WebView?,
                  request: WebResourceRequest?,
                  errorResponse: android.webkit.WebResourceResponse?
                ) {
                  if (request?.isForMainFrame == true && (errorResponse?.statusCode ?: 200) >= 400) {
                    showUrlDialog("Yayin adresi su an kapali (${errorResponse?.statusCode}). AI Studio'dan aldiginiz canli adresi girin:")
                  }
                }
              }

              rootLayout.addView(webView, FrameLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
              ))
              setContentView(rootLayout)

              val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              val savedUrl = prefs.getString(KEY_URL, DEFAULT_URL) ?: DEFAULT_URL
              webView.loadUrl(savedUrl)
            }

            private fun showUrlDialog(title: String) {
              val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              val input = EditText(this).apply {
                setText(prefs.getString(KEY_URL, DEFAULT_URL) ?: DEFAULT_URL)
              }
              AlertDialog.Builder(this)
                .setTitle(title)
                .setMessage("Eymen TV & Radyo · Hazirlayan: Mehmet Cengiz Akdag")
                .setView(input)
                .setPositiveButton("Ac") { _, _ ->
                  val url = input.text.toString().trim()
                  if (url.startsWith("http")) {
                    prefs.edit().putString(KEY_URL, url).apply()
                    webView.loadUrl(url)
                  }
                }
                .setNegativeButton("Yenile") { _, _ -> webView.reload() }
                .show()
            }

            override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
              if (keyCode == KeyEvent.KEYCODE_MENU || keyCode == KeyEvent.KEYCODE_INFO) {
                showUrlDialog("Sunucu Adresi Ayarla")
                return true
              }
              if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                webView.goBack()
                return true
              }
              return super.onKeyDown(keyCode, event)
            }
          }
          EOF

      - name: Gradle 8.7 ile APK Derle
        working-directory: android-apk
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -qo /tmp/g.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: hazir-apk
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
