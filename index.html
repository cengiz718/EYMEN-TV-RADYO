<!doctype html>
<html lang="tr" data-theme="modern">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Eymen TV & Radyo</title>
    <meta name="description" content="Canlı TV kanalları, çoklu ekran modu, online radyo, EPG yayın akışı ve M3U/Xtream destekli televizyon ve mobil yayın oynatıcısı." />
    <meta property="og:title" content="Eymen TV & Radyo" />
    <meta property="og:description" content="Canlı TV kanalları, çoklu ekran modu, online radyo, EPG yayın akışı ve M3U/Xtream destekli televizyon ve mobil yayın oynatıcısı." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        position: relative;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        touch-action: manipulation;
      }

      /* Dekoratif dalga / görsel / arka plan katmanlarının sağ menüye tıklamayı kesmesini önler */
      [class*="visualizer"],
      [class*="wave"],
      [class*="backdrop"],
      [class*="ambient"],
      [class*="glow"],
      canvas {
        pointer-events: none;
      }

      /* Sağ çekmece / sağ panel / ayarlar / modal katmanlarını her zaman tıklanabilir tutar */
      [class*="right-panel"],
      [class*="rightPanel"],
      [class*="drawer"],
      [class*="sidebar-right"],
      [class*="modal"],
      [role="dialog"],
      aside {
        position: relative;
        z-index: 9990;
        pointer-events: auto !important;
      }

      /* Sağ panel içindeki tüm buton, input, select ve tıklanabilir öğelerin etkileşimini garanti eder */
      [class*="right-panel"] *,
      [class*="rightPanel"] *,
      [class*="drawer"] *,
      [class*="modal"] *,
      [role="dialog"] * {
        pointer-events: auto !important;
      }

      /* Sağ menüyü genişlet ve sekme yazılarının "..." ile kırpılmasını önle */
      [class*="right-panel"],
      [class*="rightPanel"],
      [class*="drawer"],
      [class*="sidebar-right"] {
        min-width: 390px !important;
        width: clamp(390px, 32vw, 480px) !important;
      }

      [role="tablist"],
      [class*="tabs"],
      [class*="tab-list"] {
        display: flex !important;
        flex-wrap: nowrap !important;
        gap: 6px !important;
        overflow-x: auto !important;
        scrollbar-width: none;
      }

      [role="tablist"]::-webkit-scrollbar,
      [class*="tabs"]::-webkit-scrollbar,
      [class*="tab-list"]::-webkit-scrollbar {
        display: none;
      }

      [role="tab"],
      [role="tablist"] button,
      [class*="tabs"] > button,
      [class*="tab-list"] > button {
        flex: 1 0 auto !important;
        min-width: max-content !important;
        white-space: nowrap !important;
        text-overflow: clip !important;
        overflow: visible !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
        font-size: 13px !important;
      }

      /* Alt yatay menü modu aktif edildiğinde (data-eymen-menu="bottom") */
      html[data-eymen-menu="bottom"] body {
        padding-bottom: 64px !important;
      }

      html[data-eymen-menu="bottom"] #eymen-bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(10, 15, 26, 0.96);
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px);
      }

      html[data-eymen-menu="bottom"] #eymen-bottom-nav button,
      html[data-eymen-menu="bottom"] #eymen-bottom-nav [role="tab"] {
        flex: 1 1 0;
        min-width: 0;
        white-space: nowrap;
        padding: 8px 10px !important;
        font-size: 13px !important;
      }

      /* Sol: Film & Dizi | Sağ: TV & Radyo yerleşimi */
      #eymen-split-layout {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        box-sizing: border-box;
      }

      #eymen-left-col,
      #eymen-right-col {
        flex: 1 1 50%;
        min-width: 0;
        box-sizing: border-box;
      }

      #eymen-left-col {
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        padding-right: 10px;
      }

      #eymen-right-col {
        padding-left: 10px;
      }

      @media (max-width: 768px) {
        #eymen-split-layout {
          flex-direction: column;
        }
        #eymen-left-col {
          border-right: none;
          border-bottom: 1px solid rgba(255, 255, 255, 0.12);
          padding-right: 0;
          padding-bottom: 10px;
        }
        #eymen-right-col {
          padding-left: 0;
          padding-top: 10px;
        }
      }
    </style>
  </head>
  <body class="bg-[var(--bg)] text-[var(--ink)] antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>

    <script>
      (function eymenMenuAndSplitPlacement() {
        // Yatay alt menüye almak isterseniz "bottom", sağda geniş tutmak isterseniz "right" yapın
        const MENU_MODE = "right";
        const LEFT_KEYWORDS = /film|dizi|movie|series/i;
        const RIGHT_KEYWORDS = /\btv\b|radyo|kanal|radio/i;

        function syncMenuLayout() {
          document.documentElement.setAttribute("data-eymen-menu", MENU_MODE);

          const tabButtons = Array.from(document.querySelectorAll("button, [role='tab']"))
            .filter((el) => {
              if (el.closest("#eymen-bottom-nav")) return false;
              const label = (el.textContent || "").trim();
              return /^(Kan|Fil|Rad|Aya)/i.test(label) && label.length <= 24;
            });

          tabButtons.forEach((btn) => {
            btn.style.whiteSpace = "nowrap";
            btn.style.flex = "1 0 auto";
            btn.style.minWidth = "max-content";
            btn.style.overflow = "visible";
            btn.style.textOverflow = "clip";
          });

          if (MENU_MODE === "bottom" && tabButtons.length >= 2) {
            let bottomNav = document.getElementById("eymen-bottom-nav");
            if (!bottomNav) {
              bottomNav = document.createElement("div");
              bottomNav.id = "eymen-bottom-nav";
              document.body.appendChild(bottomNav);
            }

            tabButtons.forEach((btn) => {
              if (btn.parentElement !== bottomNav) {
                bottomNav.appendChild(btn);
              }
            });
          }
        }

        function ensureSplitContainer() {
          let wrap = document.getElementById("eymen-split-layout");
          if (!wrap) {
            wrap = document.createElement("div");
            wrap.id = "eymen-split-layout";

            const leftCol = document.createElement("section");
            leftCol.id = "eymen-left-col";

            const rightCol = document.createElement("section");
            rightCol.id = "eymen-right-col";

            wrap.appendChild(leftCol);
            wrap.appendChild(rightCol);
            document.body.appendChild(wrap);
          }

          return {
            leftCol: document.getElementById("eymen-left-col"),
            rightCol: document.getElementById("eymen-right-col")
          };
        }

        function arrangeSections() {
          const { leftCol, rightCol } = ensureSplitContainer();
          const candidates = Array.from(
            document.querySelectorAll("section, article, [class*='panel'], [class*='section'], [class*='list'], [class*='grid']")
          ).filter((el) => {
            if (!el || el.closest("#eymen-split-layout")) return false;
            if (el.id === "root" || el.querySelector("#eymen-split-layout")) return false;
            const text = (el.innerText || "").slice(0, 120);
            return LEFT_KEYWORDS.test(text) || RIGHT_KEYWORDS.test(text);
          });

          const topBlocks = candidates.filter(
            (el) => !candidates.some((other) => other !== el && other.contains(el))
          );

          topBlocks.forEach((block) => {
            const headerText = (block.innerText || "").slice(0, 120);
            if (LEFT_KEYWORDS.test(headerText) && !RIGHT_KEYWORDS.test(headerText)) {
              leftCol.appendChild(block);
            } else if (RIGHT_KEYWORDS.test(headerText)) {
              rightCol.appendChild(block);
            }
          });
        }

        function runAll() {
          syncMenuLayout();
          arrangeSections();
        }

        window.addEventListener("DOMContentLoaded", runAll);
        const observer = new MutationObserver(runAll);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(runAll, 500);
        setTimeout(runAll, 1500);
      })();
    </script>
  </body>
</html>
